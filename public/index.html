<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lanternfall</title>
<meta name="theme-color" content="#07060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lanternfall">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2710%27 fill=%27%230b0a0d%27/%3E%3Cpath d=%27M24 14h16l-3 6H27z%27 fill=%27%23a8875a%27/%3E%3Crect x=%2722%27 y=%2720%27 width=%2720%27 height=%2726%27 rx=%274%27 fill=%27none%27 stroke=%27%23a8875a%27 stroke-width=%273%27/%3E%3Cpath d=%27M32 25c4 5 5 9 0 15-5-6-4-10 0-15z%27 fill=%27%23e8a24a%27/%3E%3Cpath d=%27M24 46h16v4H24z%27 fill=%27%23a8875a%27/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Grenze Gotisch";src:url(fonts/grenze-gotisch-latin-600-normal.woff2) format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"Cinzel";src:url(fonts/cinzel-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Cinzel";src:url(fonts/cinzel-latin-600-normal.woff2) format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"Cinzel";src:url(fonts/cinzel-latin-700-normal.woff2) format("woff2");font-weight:700 900;font-display:swap}
@font-face{font-family:"IM Fell English";src:url(fonts/im-fell-english-latin-400-normal.woff2) format("woff2");font-style:normal;font-display:swap}
@font-face{font-family:"IM Fell English";src:url(fonts/im-fell-english-latin-400-italic.woff2) format("woff2");font-style:italic;font-display:swap}
:root{
  --ink:#07060a; --panel:rgba(12,10,14,.9); --panel2:rgba(20,17,22,.92); --line:#3b3122; --line2:#5a4a30;
  --gold:#c9a45c; --gold2:#e8c983; --bone:#d9cfb8; --dim:#8d8676; --blood:#8e1f1f; --blood2:#c23a2e; --fog:#8a90a2; --hollow:#9a6cff;
  --serif:"IM Fell English", Georgia, serif; --caps:"Cinzel", Georgia, serif; --goth:"Grenze Gotisch", "Cinzel", serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--bone);font-family:var(--serif);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#overlay{position:fixed;inset:0;pointer-events:none;z-index:1}
button{font-family:var(--caps);cursor:pointer}
kbd{font-family:var(--caps);font-size:10px;color:var(--gold2);background:rgba(0,0,0,.6);border:1px solid var(--line2);border-radius:3px;padding:0 4px;line-height:14px}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#14121a 0%,#050407 70%);transition:opacity 1.1s}
#loading.done{opacity:0;pointer-events:none}
#loading h1{font-family:var(--goth);font-weight:600;font-size:clamp(56px,10vw,124px);margin:0;letter-spacing:.04em;color:#d6c8a6;text-shadow:0 0 30px rgba(255,170,80,.25),0 0 2px #000}
#loading .tag{font-style:italic;color:var(--dim);margin:6px 0 40px;font-size:18px}
#loading .bar{width:min(420px,70vw);height:3px;background:#1a1610;border:1px solid #2a2418}
#loading .fill{height:100%;width:0;background:linear-gradient(90deg,#7a5a2a,#ffcf7a);box-shadow:0 0 12px #ffb050;transition:width .2s}
#loading .pct{margin-top:14px;font-family:var(--caps);font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
#loading .flame{width:10px;height:16px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 70%,#fff2c0,#ffb040 45%,#a02a00 80%);box-shadow:0 0 30px 10px rgba(255,150,40,.35);margin-bottom:28px;animation:flick 1.6s infinite}
@keyframes flick{0%,100%{transform:scale(1) translateY(0);opacity:1}40%{transform:scale(.92,1.08) translateY(-1px);opacity:.85}70%{transform:scale(1.05,.95);opacity:.95}}

/* ---------- generic screens ---------- */
.screen{position:fixed;inset:0;pointer-events:auto;opacity:0;transition:opacity .45s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.screen.on{opacity:1}
.btn{display:block;min-width:220px;padding:12px 26px;margin:6px 0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);background:linear-gradient(180deg,rgba(32,27,22,.92),rgba(14,12,12,.92));border:1px solid var(--line2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 6px 20px rgba(0,0,0,.5);transition:all .15s;position:relative}
.btn small{display:block;font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:13px;color:var(--dim);margin-top:3px}
.btn:hover:not([disabled]){color:#fff;border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 22px rgba(201,164,92,.25)}
.btn.primary{border-color:var(--gold);color:var(--gold2);background:linear-gradient(180deg,rgba(60,42,20,.95),rgba(24,17,10,.95))}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px}
.row .btn{min-width:180px}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 60px rgba(0,0,0,.6);padding:30px 36px;max-width:min(720px,92vw);max-height:90vh;overflow:auto}
.panel h2,.screen-title{font-family:var(--goth);font-weight:600;font-size:44px;margin:0 0 16px;color:#e2d3ae;letter-spacing:.03em;text-align:center}
.chip{padding:8px 16px;margin:3px;background:rgba(20,17,14,.9);color:var(--dim);border:1px solid var(--line);letter-spacing:.1em;font-size:12px;text-transform:uppercase}
.chip.sel{color:var(--gold2);border-color:var(--gold);box-shadow:0 0 14px rgba(201,164,92,.2)}
.hint{color:var(--dim);font-style:italic;font-size:15px;line-height:1.45}
.eyebrow{font-family:var(--caps);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;pointer-events:auto}
.modal p{font-size:19px;text-align:center;max-width:420px}

/* ---------- title ---------- */
.title-screen{background:radial-gradient(ellipse at 18% 60%,rgba(0,0,0,.72) 0%,rgba(0,0,0,0) 55%),linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.7) 100%);align-items:flex-start;justify-content:center;padding-left:7vw}
.title-screen .logo{position:absolute;top:9vh;left:0;right:0;text-align:center}
.title-screen .logo h1{font-family:var(--goth);font-weight:600;font-size:clamp(64px,11vw,150px);margin:0;letter-spacing:.04em;color:#ddd0ae;text-shadow:0 0 50px rgba(255,160,70,.18),0 4px 0 rgba(0,0,0,.6)}
.title-screen .logo p{margin:0;font-style:italic;font-size:clamp(15px,1.6vw,21px);color:#a59d8c;text-shadow:0 2px 6px #000}
.title-screen .menu{margin-top:18vh}
.title-screen .foot{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:13px;color:#6a6458;font-style:italic}

/* ---------- hero select ---------- */
.hero-screen{background:rgba(5,4,7,.84);padding:24px}
.hero-cards{display:grid;grid-template-columns:repeat(4,minmax(0,250px));gap:16px;margin-bottom:12px}
.hero-card{background:var(--panel2);border:1px solid var(--line);padding:14px 14px 16px;cursor:pointer;transition:all .2s;text-align:center}
.hero-card:hover{border-color:var(--line2);transform:translateY(-2px)}
.hero-card.sel{border-color:var(--gold);box-shadow:0 0 30px rgba(201,164,92,.18),inset 0 0 40px rgba(201,164,92,.06)}
.hero-card .por{width:128px;height:128px;margin:0 auto 8px;border-radius:50%;overflow:hidden;border:2px solid var(--line2);background:radial-gradient(circle at 50% 35%,#2a2620,#0a0908 70%)}
.hero-card.sel .por{border-color:var(--gold)}
.hero-card .por img{width:100%;height:100%;object-fit:cover}
.hero-card h3{font-family:var(--caps);font-size:17px;letter-spacing:.08em;margin:2px 0;color:#e8dcc0}
.hero-card .sub{font-style:italic;color:var(--gold);font-size:13px;margin-bottom:8px}
.hero-card p{font-size:14px;color:#b8b0a0;line-height:1.35;min-height:57px;margin:0 0 10px}
.hero-card .stats{display:grid;grid-template-columns:62px 1fr;gap:5px 8px;align-items:center;text-align:left;font-family:var(--caps);font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.pip{height:5px;background:#1c1914;border:1px solid #2c261c}.pip i{display:block;height:100%;background:linear-gradient(90deg,#7a5a2a,#e8c983)}
.hero-card .abl{display:grid;gap:4px;margin-top:10px;text-align:left;font-size:13px;color:#c8bfa8}
.hero-card .abl span{display:flex;align-items:center;gap:6px}.hero-card .abl svg{color:var(--gold);flex:none}.hero-card .abl b{font-family:var(--caps);font-size:10px;color:var(--gold2);width:10px}
.diff{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.dnote{margin-left:12px;font-style:italic;color:var(--dim);font-size:15px;min-width:300px}

/* ---------- prologue / chapter card / ending ---------- */
.prologue,.chapter-card,.ending{background:#000}
.prologue p{max-width:760px;font-size:clamp(20px,2.3vw,30px);line-height:1.5;text-align:center;color:#cfc4ac;opacity:0;padding:0 24px}
.prologue p.in{animation:fadeup 2.2s forwards}
.prologue small{position:absolute;bottom:28px;color:#5a5448;font-family:var(--caps);letter-spacing:.2em;font-size:11px;text-transform:uppercase}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chapter-card{background:radial-gradient(ellipse,rgba(0,0,0,.6),#000 75%)}
.chapter-card .n{font-family:var(--caps);letter-spacing:.5em;color:var(--gold);font-size:14px;text-transform:uppercase}
.chapter-card h1{font-family:var(--goth);font-weight:600;font-size:clamp(54px,8vw,104px);margin:8px 0;color:#e2d3ae;text-shadow:0 0 40px rgba(255,170,90,.15)}
.chapter-card .p{font-style:italic;color:var(--dim);font-size:20px}
.ending h1{font-family:var(--goth);font-size:clamp(50px,7vw,96px);font-weight:600;color:#e2d3ae;margin:0}
.ending p{font-size:22px;font-style:italic;color:#a69e8c}.ending .end{font-family:var(--caps);letter-spacing:.4em;color:var(--gold);margin:30px 0}

/* ---------- story ---------- */
#story{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
#story.on{opacity:1;pointer-events:auto}
.letterbox{position:absolute;left:0;right:0;height:9vh;background:#000}
.letterbox.top{top:0}.letterbox.bot{bottom:0}
.dlg{position:absolute;left:50%;bottom:11vh;transform:translateX(-50%);width:min(980px,94vw);display:flex;gap:20px;align-items:flex-start;background:linear-gradient(180deg,rgba(10,9,12,.86),rgba(6,5,8,.94));border:1px solid var(--line);border-top-color:var(--line2);padding:18px 24px 16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6);transition:opacity .3s}
.dlg.hide{opacity:0}
.dlg-portrait{width:104px;height:104px;flex:none;border-radius:50%;overflow:hidden;border:2px solid var(--line2);background:radial-gradient(circle at 50% 35%,#2a2620,#0a0908 70%)}
.dlg-portrait.none{background:radial-gradient(circle,#2a1a3a,#06040a 70%);border-color:#4a3a6a}
.dlg-portrait img{width:100%;height:100%;object-fit:cover}
.dlg-portrait.none img{display:none}
.dlg-body{flex:1;min-height:104px}
.dlg-name{font-family:var(--caps);font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:4px 0 8px}
.dlg-text{font-size:clamp(18px,1.6vw,22px);line-height:1.45;color:#e2d8c2;min-height:60px}
.dlg-text.italic{font-style:italic;color:#c8b4f0}
.dlg-hint{text-align:right;font-family:var(--caps);font-size:10px;letter-spacing:.2em;color:#5a5448;text-transform:uppercase;margin-top:6px}
.dlg-choices{display:grid;gap:10px;margin-top:6px}
.choice{text-align:left;background:linear-gradient(180deg,rgba(36,28,18,.95),rgba(16,13,10,.95));border:1px solid var(--line2);color:var(--bone);padding:12px 16px;font-size:17px;letter-spacing:.06em}
.choice:hover{border-color:var(--gold);color:#fff;box-shadow:0 0 20px rgba(201,164,92,.2)}
.choice .t{display:block;font-family:var(--caps)}
.choice .n{display:block;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--dim);margin-top:4px;letter-spacing:0;text-transform:none}
.dlg-skip{position:absolute;top:calc(9vh + 14px);right:20px;background:rgba(0,0,0,.5);border:1px solid var(--line);color:var(--dim);padding:6px 14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.narr{position:absolute;left:0;right:0;bottom:16vh;text-align:center;opacity:0;transition:opacity .6s;pointer-events:none}
.narr.on{opacity:1}
.narr p{display:inline-block;max-width:820px;font-size:clamp(20px,2vw,28px);font-style:italic;color:#d8ccb2;text-shadow:0 2px 12px #000,0 0 30px #000;line-height:1.45;padding:0 20px}

/* ---------- camp ---------- */
.camp-screen{background:rgba(5,4,7,.9);justify-content:flex-start;padding:22px 3vw 0}
.camp-screen header{width:100%;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:12px}
.camp-screen header h2{font-family:var(--goth);font-weight:600;font-size:40px;margin:2px 0 0;color:#e2d3ae}
.camp-screen header h2 span{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--dim);margin-left:10px}
.purse{display:flex;gap:22px;font-family:var(--caps);letter-spacing:.1em;font-size:14px;color:var(--dim)}
.purse span{display:flex;align-items:center;gap:6px}.purse b{color:var(--gold2);font-size:20px}.purse svg{color:var(--gold)}
.tabs{width:100%;display:flex;gap:4px;margin:12px 0}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-size:14px;letter-spacing:.2em;text-transform:uppercase;padding:8px 18px}
.tabs button.sel{color:var(--gold2);border-bottom-color:var(--gold)}
.camp-screen main{width:100%;flex:1;overflow:hidden;min-height:0}
.camp-screen footer{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding:12px 0 16px}
.camp-screen footer .btn{min-width:170px;margin:0}
.loadout{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.loadout label{font-family:var(--caps);font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-right:8px}
.slot{width:54px;height:54px;border:1px solid var(--line2);background:#0e0c0c;position:relative;cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover}
.slot span{position:absolute;right:2px;bottom:1px;font-family:var(--caps);font-size:11px;color:var(--gold2);text-shadow:0 1px 2px #000}
.slot.empty{border-style:dashed;opacity:.5;cursor:default}
.muster{display:grid;grid-template-columns:1fr 400px;gap:20px;height:100%}
.roster{overflow:auto;padding-right:8px}
.roster h4{font-family:var(--caps);font-size:12px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;margin:10px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ucard{position:relative;background:#0e0c0d;border:1px solid var(--line);cursor:pointer;aspect-ratio:1/1.18;overflow:hidden;transition:all .15s}
.ucard img{width:100%;height:82%;object-fit:cover;display:block;background:radial-gradient(circle at 50% 35%,#24201c,#080707 70%)}
.ucard .nm{position:absolute;left:0;right:0;bottom:0;font-family:var(--caps);font-size:10px;letter-spacing:.05em;text-align:center;padding:3px 2px;background:rgba(0,0,0,.75);color:#d8ccb4;line-height:1.15}
.ucard .c{position:absolute;top:3px;left:4px;font-family:var(--caps);font-size:13px;color:var(--gold2);text-shadow:0 1px 3px #000}
.ucard .lv{position:absolute;top:3px;right:4px;color:var(--gold);font-size:11px;text-shadow:0 1px 3px #000}
.ucard:hover{border-color:var(--line2)}
.ucard.sel{border-color:var(--gold);box-shadow:0 0 16px rgba(201,164,92,.25)}
.ucard.in{outline:2px solid rgba(201,164,92,.55);outline-offset:-3px}
.ucard.locked img{filter:grayscale(1) brightness(.25)}
.ucard.locked .lk{position:absolute;top:34%;left:4px;right:4px;text-align:center;font-style:italic;font-size:11px;color:#8a8270;line-height:1.2}
.muster aside{background:var(--panel2);border:1px solid var(--line);padding:16px;overflow:auto}
.detail .dpor{width:150px;height:150px;margin:0 auto 10px;border-radius:50%;overflow:hidden;border:2px solid var(--line2);background:radial-gradient(circle at 50% 35%,#2a2620,#0a0908 70%)}
.dpor img{width:100%;height:100%;object-fit:cover}
.dpor.big{width:180px;height:180px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);margin:0 auto 10px;background:radial-gradient(circle at 50% 35%,#2a2620,#0a0908 70%)}
.detail h3{font-family:var(--caps);font-size:20px;margin:2px 0 4px;color:#eadfc4}
.detail p{font-size:15px;line-height:1.4;color:#c8bfa8;margin:6px 0}.detail p.lore{font-style:italic;color:#8d8676}
.stars{display:flex;align-items:center;gap:4px;font-family:var(--caps);font-size:11px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase}
.stars i,.ranks i{width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--line2);display:inline-block;margin-right:3px}
.stars i.on,.ranks i.on{background:var(--gold);border-color:var(--gold2);box-shadow:0 0 6px rgba(232,201,131,.6)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin:10px 0;font-size:14px}
.kv span{color:var(--dim)}.kv b{font-family:var(--caps);color:#e8dcc0;font-weight:600;text-align:right}
.kv.big{font-size:18px;min-width:min(420px,86vw);margin:20px 0}
.detail .row .btn{min-width:0;flex:1;font-size:12px;padding:10px 12px}
.upgrades{display:grid;gap:10px;max-width:860px;margin:10px auto}
.uprow{display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--panel2);border:1px solid var(--line);padding:14px 18px}
.uprow b{font-family:var(--caps);font-size:16px;letter-spacing:.06em;color:#eadfc4}.uprow p{margin:4px 0 8px;color:#a8a090;font-size:15px}
.uprow .btn{min-width:200px;margin:0;font-size:12px}
.max{font-family:var(--caps);letter-spacing:.2em;color:var(--gold);font-size:12px;text-transform:uppercase}
.herotab{display:grid;grid-template-columns:330px 1fr;gap:24px;height:100%;overflow:auto}
.herotab .hcol{text-align:center}.herotab h3{font-family:var(--caps);margin:4px 0;color:#eadfc4}.herotab .sub{font-style:italic;color:var(--gold);margin-bottom:12px}
.upgrades.small .uprow{flex-direction:column;align-items:stretch;text-align:left}
.talents h4,.chronicle h4{font-family:var(--caps);letter-spacing:.2em;color:var(--gold);font-size:13px;text-transform:uppercase;margin:4px 0 12px}
.talents h4 small{display:block;font-family:var(--serif);font-style:italic;letter-spacing:0;text-transform:none;color:var(--dim);font-size:14px;margin-top:4px}
.talent{display:grid;grid-template-columns:60px 1fr auto;gap:16px;align-items:center;background:var(--panel2);border:1px solid var(--line);padding:12px 16px;margin-bottom:10px}
.talent .ic{width:56px;height:56px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--gold2);position:relative;background:#0e0c0b}
.talent .ic kbd{position:absolute;bottom:-6px;right:-6px}
.talent b{font-family:var(--caps);color:#eadfc4}.talent p{margin:4px 0 6px;color:#a8a090;font-size:14px}
.talent .btn{min-width:170px;margin:0;font-size:12px}
.chronicle{display:grid;grid-template-columns:1fr 1fr;gap:28px;height:100%;overflow:auto}
.entry{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}.entry b{font-family:var(--caps);font-weight:600;color:#e2d6bc}.entry span{font-style:italic;color:var(--dim)}
.choice-made{font-style:italic;color:#c4b48c;margin:8px 0}
.stats-line{margin-top:18px;color:var(--dim)}.stats-line b{color:var(--gold2);font-family:var(--caps)}
.beasts{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.beast{text-align:center;font-size:12px;color:#b8ae98}.beast img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid #3a2a4a;background:radial-gradient(circle at 50% 35%,#1e1826,#06050a 70%)}
.beast.boss img{border-color:#7a2a3a}.beast span{display:block;line-height:1.2;margin-top:3px}

/* ---------- results / pause / settings / credits ---------- */
.results{background:radial-gradient(ellipse,rgba(0,0,0,.55),rgba(0,0,0,.92) 75%)}
.results h1{font-family:var(--goth);font-weight:600;font-size:clamp(50px,7vw,92px);margin:0;color:#e2d3ae}
.results.lose h1{color:#c87a6a}
.results .sub{font-style:italic;color:var(--dim);font-size:20px;margin:6px 0 0}
.unlocks h4{font-family:var(--caps);letter-spacing:.2em;color:var(--gold);font-size:13px;text-transform:uppercase;text-align:center}
.unlocks .ucard{width:96px}
.unlocks .row{flex-wrap:wrap;justify-content:center;max-width:min(900px,92vw);margin:0 auto}
.pause{background:rgba(0,0,0,.6)}
.pause .panel{display:flex;flex-direction:column;align-items:center;min-width:340px}
.controls{margin-top:18px;font-size:14px;line-height:1.7;color:var(--dim);text-align:center}.controls b{font-family:var(--caps);font-size:11px;letter-spacing:.1em;color:#c8b890}
.settings{background:rgba(0,0,0,.7)}
.settings .panel{min-width:min(460px,92vw)}
.settings label{display:block;font-family:var(--caps);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.settings label.check{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:.05em;font-size:14px;font-family:var(--serif);color:#c8bfa8}
.settings input[type=range]{width:100%;accent-color:#c9a45c}
.settings .btn{margin:22px auto 0}
.credits .panel p{font-size:16px;line-height:1.5;color:#c8bfa8}.credits h4{font-family:var(--caps);letter-spacing:.2em;color:var(--gold);font-size:12px;text-transform:uppercase;margin:16px 0 2px}
.credits .btn{margin:20px auto 0}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;font-family:var(--caps)}
#hud.on{opacity:1}
#hud button,#hud .hud-card,#hud .hud-ab{pointer-events:auto}
.bar{position:relative;height:12px;background:rgba(10,8,8,.8);border:1px solid #2e2618;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .15s}
.bar b{position:absolute;inset:0;text-align:center;font-size:9px;line-height:11px;color:#f2e6cc;text-shadow:0 1px 2px #000;font-weight:600;letter-spacing:.08em}
.hud-hero{position:absolute;top:16px;left:16px;display:flex;gap:12px;align-items:center}
.hud-portrait{width:76px;height:76px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(0,0,0,.7),0 0 20px rgba(0,0,0,.6);background:radial-gradient(circle at 50% 35%,#2a2620,#0a0908 70%)}
.hud-portrait img{width:100%;height:100%;object-fit:cover}
.hud-bars{width:230px;display:grid;gap:4px}
.hud-name{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e8dcc0;text-shadow:0 1px 3px #000}
.hud-name .lvl{color:var(--gold2)}
.bar.hp{height:14px}.bar.hp i{background:linear-gradient(180deg,#c23a2e,#6a1414)}
.bar.st{height:6px}.bar.st i{background:linear-gradient(90deg,#8a7a50,#e8d8a0)}
.bar.xp{height:3px;border:none;background:rgba(0,0,0,.5)}.bar.xp i{background:#b49aff}
.hud-top{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(560px,48vw);text-align:center}
.hud-wave{display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 1px 4px #000}
.hud-wave .w{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:#e8d8b0}
.hud-wave .o{font-family:var(--serif);font-style:italic;font-size:14px;color:#a8a090}
.hud-struct{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.sbar label{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#bfb49a;margin-bottom:3px;text-shadow:0 1px 3px #000}
.sbar .bar{height:8px}.sbar.castle .bar i{background:linear-gradient(90deg,#8a6a2a,#e8c983)}
.sbar.castle.low .bar{animation:pulse 0.8s infinite}
.sbar.rift{position:relative}.sbar.rift .bar i{background:linear-gradient(90deg,#5a2a8a,#c08aff)}
.sbar.dawn label{text-align:right}.sbar.dawn .bar i{background:linear-gradient(90deg,#3a3a5a,#8a7a6a 60%,#f0c070);transition:width .6s}
.sbar.rift .shield{position:absolute;right:-4px;top:-2px;color:#b48cff;display:none;filter:drop-shadow(0 0 4px #8a4aff)}
.sbar.rift.shielded .shield{display:block}.sbar.rift.shielded .bar{opacity:.55}
@keyframes pulse{50%{box-shadow:0 0 12px #c23a2e;border-color:#c23a2e}}
.hud-boss{margin-top:12px;display:none}
.hud-boss.on{display:block;animation:fadeup .6s}
.hud-boss label{font-family:var(--goth);font-size:26px;color:#e8c8c0;text-shadow:0 0 14px rgba(200,40,40,.4),0 2px 4px #000;letter-spacing:.04em}
.hud-boss .bar{height:14px;border-color:#5a1a1a}.hud-boss .bar i{background:linear-gradient(180deg,#d03a3a,#5a0e0e)}
.hud-map{position:absolute;top:16px;right:16px;border:1px solid var(--line2);box-shadow:0 0 0 3px rgba(0,0,0,.6);width:260px;height:104px}
.hud-bottom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:14px}
.hud-cp{display:flex;flex-direction:column;align-items:center;gap:4px}
.cp-orb{--fill:0%;width:70px;height:70px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(0,0,0,.7),0 0 24px rgba(255,170,60,.2),inset 0 0 18px rgba(0,0,0,.8);background:linear-gradient(0deg,rgba(255,170,60,.55) var(--fill),rgba(10,8,8,.92) var(--fill));display:flex;flex-direction:column;align-items:center;justify-content:center}
.cp-orb .v{font-size:24px;font-weight:700;color:#fff2d0;text-shadow:0 1px 4px #000;line-height:1}
.cp-orb small{font-size:9px;letter-spacing:.2em;color:#e8d8b0}
.cp-meta{display:flex;flex-direction:column;align-items:center;font-size:10px;letter-spacing:.1em;color:#bfb49a;text-shadow:0 1px 3px #000}
.hud-cards{display:flex;gap:6px}
.hud-card{position:relative;width:70px;height:88px;border:1px solid var(--line);background:#0c0a0a;cursor:pointer;overflow:hidden;transition:transform .1s,border-color .1s}
.hud-card img{width:100%;height:76%;object-fit:cover;display:block;background:radial-gradient(circle at 50% 35%,#24201c,#080707 70%)}
.hud-card .nm{position:absolute;left:0;right:0;bottom:0;height:24%;font-size:8px;letter-spacing:.04em;text-align:center;color:#cfc4ac;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;line-height:1}
.hud-card .cost{position:absolute;top:2px;left:4px;font-size:15px;font-weight:700;color:#ffd890;text-shadow:0 1px 3px #000,0 0 6px #000}
.hud-card kbd{position:absolute;top:3px;right:3px}
.hud-card .cnt{position:absolute;top:22px;left:4px;font-size:10px;color:#e8dcc0;text-shadow:0 1px 2px #000}
.hud-card .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.72)}
.hud-card.poor img{filter:grayscale(.85) brightness(.55)}
.hud-card.ready{border-color:var(--line2)}
.hud-card.ready:hover{transform:translateY(-3px);border-color:var(--gold)}
.hud-abil{position:absolute;right:18px;bottom:18px;display:flex;gap:8px;align-items:flex-end}
.hud-ab{position:relative;width:56px;height:56px;border:1px solid var(--line2);background:rgba(12,10,10,.9);color:#d8c690;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.hud-ab.ult{width:68px;height:68px;border-color:var(--gold);color:var(--gold2)}
.hud-ab .sweep{position:absolute;inset:0}
.hud-ab .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000}
.hud-ab kbd{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%)}
.hud-ab.ready{box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 12px rgba(232,201,131,.18)}
.hud-ab.fire{animation:abfire .4s}
@keyframes abfire{0%{transform:scale(1.15);box-shadow:0 0 30px rgba(255,200,120,.8)}100%{transform:scale(1)}}
.hud-toast{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);font-family:var(--serif);font-style:italic;font-size:18px;color:#e8dcc0;text-shadow:0 2px 6px #000,0 0 18px #000;opacity:0;transition:opacity .3s;white-space:nowrap}
.hud-toast.on{opacity:1}
.hud-banner{position:absolute;left:0;right:0;top:24vh;text-align:center;opacity:0;pointer-events:none}
.hud-banner.on{animation:banner 3s forwards}
.hud-banner h1{font-family:var(--goth);font-weight:600;font-size:clamp(38px,5vw,64px);margin:0;color:#eadbb4;letter-spacing:.06em;text-shadow:0 0 30px rgba(0,0,0,.9),0 3px 6px #000}
.hud-banner p{font-family:var(--serif);font-style:italic;font-size:20px;color:#b8ae98;margin:4px 0 0;text-shadow:0 2px 8px #000}
@keyframes banner{0%{opacity:0;transform:scale(1.06)}10%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.hud-voice{position:absolute;left:50%;top:17vh;transform:translateX(-50%);font-family:var(--serif);font-style:italic;font-size:20px;color:#c8a8ff;text-shadow:0 0 18px rgba(120,60,255,.6),0 2px 6px #000;opacity:0;transition:opacity 1.2s;white-space:nowrap}
.hud-voice b{display:block;text-align:center;font-family:var(--caps);font-style:normal;font-size:10px;letter-spacing:.3em;color:#8a6ac8;text-transform:uppercase;margin-bottom:2px}
.hud-voice.on{opacity:1}
.hud-respawn{position:absolute;left:0;right:0;top:44vh;text-align:center;font-family:var(--goth);font-size:34px;color:#c8a090;text-shadow:0 2px 10px #000;opacity:0;transition:opacity .4s}
.hud-respawn.on{opacity:1}
.hud-flash{position:absolute;inset:0;opacity:0;pointer-events:none;mix-blend-mode:screen}
.hud-help{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);font-family:var(--serif);font-size:13px;color:#7a7262;text-shadow:0 1px 3px #000;white-space:nowrap}
body.no-help .hud-help{display:none}
#hud.touch .hud-help{display:none}
/* pause button (all screens) */
.hud-pause{position:absolute;top:128px;right:16px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(12,10,10,.85);border:1px solid var(--line2);color:var(--gold2);box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.sheet-close{display:none;position:absolute;top:8px;right:10px;width:36px;height:36px;background:rgba(0,0,0,.4);border:1px solid var(--line2);color:var(--bone);font-size:16px;line-height:1}
.detail{position:relative}

/* ---------- arcade ---------- */
.arcade-screen{background:rgba(5,4,7,.92);justify-content:flex-start;padding:22px 3vw 0}
.arcade-screen header{width:100%;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:10px}
.arcade-screen header h2{font-family:var(--goth);font-weight:600;font-size:40px;margin:2px 0 0;color:#e2d3ae}
.arc-count{font-family:var(--caps);font-size:12px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase}.arc-count b{color:var(--gold2);font-size:16px}
.arc-body{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;padding-top:6px}
.arc-setup{overflow:auto;padding-right:6px}
.arc-setup h4{font-family:var(--caps);font-size:12px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;margin:10px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.arc-heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.arc-hero{background:#0e0c0d;border:1px solid var(--line);padding:6px 3px;color:var(--bone);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:0}
.arc-hero img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:1px solid var(--line2);background:radial-gradient(circle at 50% 35%,#24201c,#080707 70%)}
.arc-hero b{font-family:var(--caps);font-size:9.5px;letter-spacing:.03em;margin-top:3px;line-height:1.15;text-align:center;font-weight:400}
.arc-hero small{display:none}
.arc-hero.sel,.arc-night.sel{border-color:var(--gold);box-shadow:0 0 16px rgba(201,164,92,.2),inset 0 0 24px rgba(201,164,92,.06)}
.arc-hero.sel img{border-color:var(--gold)}
.arc-nights{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.arc-night{display:grid;grid-template-columns:22px 1fr;column-gap:6px;text-align:left;background:#0e0c0d;border:1px solid var(--line);padding:5px 7px;color:var(--bone);cursor:pointer;align-items:center;min-width:0}
.arc-night i{grid-row:1/3;font-style:normal;font-family:var(--goth);font-size:19px;color:var(--gold);text-align:center}
.arc-night b{font-family:var(--caps);font-size:10.5px;letter-spacing:.04em;font-weight:400;line-height:1.2}
.arc-night small{font-size:11px;color:var(--dim);font-style:italic;line-height:1.2}
.arc-diff{display:flex;flex-wrap:wrap}.arc-diff .chip{margin:0 6px 0 0}
.arc-foes{display:flex;flex-wrap:wrap;gap:4px}
.arc-foe{width:44px;height:44px;padding:0;border:1px solid var(--line);background:#0e0c0d;cursor:pointer;overflow:hidden}
.arc-foe img{width:100%;height:100%;object-fit:cover;display:block}
.arc-foe.boss{border-color:#8a3a3a;box-shadow:0 0 10px rgba(160,40,40,.3)}
.arc-roster{display:flex;flex-direction:column;min-height:0}
.arc-filters{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px}.arc-filters .chip{margin:0}
.arc-roster .grid{overflow:auto;flex:1;min-height:0;align-content:start;padding:2px 6px 8px 2px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-rows:118px}
.arc-roster .ucard{aspect-ratio:auto;height:100%}
.ucard .pick{position:absolute;top:3px;right:4px;background:var(--gold);color:#120e08;font-family:var(--caps);font-size:11px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 8px rgba(0,0,0,.8)}
.arc-dock{width:100%}
.arc-info{width:100%;min-height:76px;border-top:1px solid var(--line);padding:8px 0;display:flex;gap:12px;align-items:flex-start}
.arc-info img{width:60px;height:60px;object-fit:cover;border:1px solid var(--line2);flex:none;background:radial-gradient(circle at 50% 35%,#24201c,#080707 70%)}
.arc-info b{font-family:var(--caps);letter-spacing:.06em;color:#e8dcc0;font-weight:400}
.arc-info .fac{font-style:italic;color:var(--gold);font-size:13px;margin-left:6px}
.arc-info .kvs{display:flex;flex-wrap:wrap;gap:3px 12px;font-family:var(--caps);font-size:11px;letter-spacing:.06em;color:var(--dim);margin:3px 0}
.arc-info .kvs svg{color:var(--gold);vertical-align:-2px}
.arc-info p{margin:2px 0 0;font-size:14px;color:#c8bfa8;line-height:1.3}
.arc-info .hint{font-size:14px}
.arc-info .full{display:block;color:#e8946a;font-size:13px;margin-top:2px}
.arcade-screen footer{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:10px 0 calc(14px + env(safe-area-inset-bottom))}
.arcade-screen footer .btn{min-width:150px;margin:0}
.arc-score{display:flex;align-items:center;gap:20px;margin:10px 0 4px}
.arc-score .rank{font-family:var(--goth);font-size:64px;width:92px;height:92px;display:grid;place-items:center;border:2px solid var(--gold);color:var(--gold2);background:radial-gradient(circle,rgba(60,42,20,.6),rgba(10,8,6,.8))}
.arc-score .rank.r-S{color:#fff0b8;text-shadow:0 0 26px #ffb050;box-shadow:0 0 30px rgba(255,176,80,.35)}
.arc-score .rank.r-x{color:#6a6260;border-color:#3a3232;font-size:40px}
.arc-score .num{font-family:var(--caps);font-size:44px;color:#ece0c4;letter-spacing:.05em;line-height:1}
.arc-score .sub{margin-top:4px;color:var(--dim);font-size:15px}.arc-score .rec{color:#ffcf7a;font-family:var(--caps);letter-spacing:.12em;font-weight:400}
.arcade-results .eyebrow{margin-bottom:4px}
.kv.big em{font-style:italic;color:var(--dim);margin-left:6px;font-size:.9em}
.arc-six{gap:6px;margin-top:8px}.arc-six .slot{width:44px;height:44px;cursor:default}

/* ---------- narrower desktops / tablets ---------- */
@media (max-width:900px){
  .hud-map{width:180px;height:72px}.hud-bars{width:170px}.hud-portrait{width:58px;height:58px}
  .hud-pause{top:96px}
  .hud-card{width:54px;height:70px}.hud-card .nm{display:none}.hud-card img{height:100%}
  .hud-ab{width:46px;height:46px}.hud-ab.ult{width:54px;height:54px}
  .hero-cards{grid-template-columns:repeat(2,minmax(0,250px))}
  .muster{grid-template-columns:1fr}.muster aside{display:none}
  /* unit details become a sheet that slides up when a unit is tapped */
  .muster.has-sel aside{display:block;position:fixed;left:0;right:0;bottom:0;max-height:80vh;z-index:30;border:none;border-top:1px solid var(--gold);box-shadow:0 -20px 60px rgba(0,0,0,.85);padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto;background:rgba(14,12,15,.98)}
  .sheet-close{display:block}
  .herotab,.chronicle{grid-template-columns:1fr}
  .arc-body{grid-template-columns:250px 1fr;gap:14px}
  .arc-hero img{width:44px;height:44px}
}

/* ---------- phones held sideways (short screens) ---------- */
@media (max-height:520px){
  .screen{overflow-y:auto;justify-content:safe center}
  .btn{padding:8px 18px;font-size:13px;min-width:180px;margin:4px 0}
  .btn small{font-size:11px}
  .panel{padding:14px 20px;max-height:94vh}
  .panel h2,.screen-title{font-size:28px;margin:0 0 8px}
  .title-screen{padding-left:calc(6vw + env(safe-area-inset-left))}
  .title-screen .logo{top:3vh}.title-screen .logo h1{font-size:clamp(44px,9vw,64px)}.title-screen .logo p{font-size:13px}
  .title-screen .menu{margin-top:24vh}.title-screen .foot{display:none}
  .hero-screen{padding:8px 12px}
  .hero-cards{grid-template-columns:repeat(4,minmax(0,190px));gap:8px;margin-bottom:6px}
  .hero-card{padding:8px 8px 10px}.hero-card .por{width:56px;height:56px;margin-bottom:4px}
  .hero-card h3{font-size:12px}.hero-card .sub{font-size:11px;margin-bottom:4px}
  .hero-card p{font-size:11.5px;min-height:0;margin-bottom:6px;line-height:1.3}
  .hero-card .stats{display:none}.hero-card .abl{font-size:11px;gap:2px;margin-top:4px}
  .dnote{min-width:0;font-size:13px}
  .chip{padding:6px 10px;font-size:11px}
  .hero-screen .row{margin-top:4px}.hero-screen .row .btn{margin:0}
  .hero-card p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .camp-screen{padding:8px calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left))}
  .camp-screen header{padding-bottom:6px}.camp-screen header h2{font-size:26px}.camp-screen header h2 span{font-size:13px}
  .purse{gap:12px;font-size:11px}.purse b{font-size:15px}
  .tabs{margin:4px 0}.tabs button{font-size:11px;padding:6px 10px;letter-spacing:.14em}
  .camp-screen footer{padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
  .camp-screen footer .btn{min-width:120px;padding:8px 12px;font-size:12px}
